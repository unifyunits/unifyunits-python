[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unifyunits"
version = "0.1.0"
description = "Python client for the UnifyUnits Measurement API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "UnifyUnits" }]
keywords = ["units", "measurement", "conversion", "api"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "respx>=0.21,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
